{% extends "includes/header-footer.html" %}

{% block title %}Add Product - ALChicken{% endblock %}

{% block content %}
<div class="admin-container">
    <div class="admin-header">
        <h1>Add New Product</h1>
        <a href="{{ url_for('manage_products') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Products
        </a>
    </div>
    
    <div class="admin-form-container">
        <form method="POST" action="{{ url_for('add_product') }}" enctype="multipart/form-data" class="admin-form">
            <div class="form-group">
                <label for="name">Product Name *</label>
                <input type="text" id="name" name="name" required placeholder="e.g., Whole Chicken">
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4" 
                          placeholder="Describe the product..."></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="price">Price (JMD) *</label>
                    <input type="number" id="price" name="price" step="0.01" required placeholder="0.00">
                </div>
                
                <div class="form-group">
                    <label for="stock">Initial Stock *</label>
                    <input type="number" id="stock" name="stock" min="0" required placeholder="0">
                </div>
            </div>
            
            <div class="form-group">
                <label for="image">Product Image</label>
                <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/gif">
                <small>Allowed formats: JPG, PNG, GIF. Max size: 5MB</small>
                <div id="imagePreview" class="image-preview"></div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Add Product
                </button>
                <a href="{{ url_for('manage_products') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Image preview
    document.getElementById('image').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const preview = document.getElementById('imagePreview');
        
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
            };
            reader.readAsDataURL(file);
        } else {
            preview.innerHTML = '';
        }
    });
</script>
{% endblock %}
