{% extends "includes/header-footer.html" %}

{% block title %}Forgot Password - ALChicken{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="auth-container">
            <div class="auth-card">
                <div style="text-align:center; margin-bottom:20px;">
                    <i class="fas fa-lock" style="font-size:48px; color:var(--primary-color);"></i>
                </div>
                <h2>Forgot Password</h2>
                <p style="color:var(--gray-color); text-align:center; margin-bottom:25px;">
                    Enter your email address and we will send you a reset link.
                </p>

                <form method="POST" action="{{ url_for('forgot_password_page') }}">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" name="email" id="email" required
                               placeholder="Enter your registered email">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        Send Reset Link
                    </button>
                </form>

                <div class="auth-links">
                    <p>Remember your password? <a href="{{ url_for('login_page') }}">Login here</a></p>
                    <p>Don't have an account? <a href="{{ url_for('register_page') }}">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
