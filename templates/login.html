{% extends "includes/header-footer.html" %}

{% block title %}Login - ALChicken{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="auth-container">
            <div class="auth-card">
                <h2>Login to ALChicken</h2>
                <form method="POST" action="{{ url_for('login_page') }}">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" name="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" name="password" id="password" required>
                        <small>
                            <a href="{{ url_for('forgot_password_page') }}"
                               style="color:var(--primary-color);">
                                Forgot your password?
                            </a>
                        </small>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </form>

                <div class="auth-links">
                    <p>Don't have an account? <a href="{{ url_for('register_page') }}">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
