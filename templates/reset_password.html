{% extends "includes/header-footer.html" %}

{% block title %}Reset Password - ALChicken{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="auth-container">
            <div class="auth-card">
                <div style="text-align:center; margin-bottom:20px;">
                    <i class="fas fa-key" style="font-size:48px; color:var(--primary-color);"></i>
                </div>
                <h2>Reset Password</h2>
                <p style="color:var(--gray-color); text-align:center; margin-bottom:25px;">
                    Resetting password for <strong>{{ email }}</strong>
                </p>

                <form method="POST" action="{{ url_for('reset_password_page', token=token) }}">
                    <div class="form-group">
                        <label for="new_password">New Password</label>
                        <input type="password" name="new_password" id="new_password"
                               required placeholder="Minimum 6 characters">
                        <small>Minimum 6 characters</small>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirm New Password</label>
                        <input type="password" name="confirm_password" id="confirm_password"
                               required placeholder="Repeat your new password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        Reset Password
                    </button>
                </form>

                <div class="auth-links">
                    <p>Remember your password? <a href="{{ url_for('login_page') }}">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
